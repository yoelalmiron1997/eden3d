area: Topper para tortas
prefijo: TOP
specs:
  - id: TOP-001
    titulo: El topper sale siempre en una sola pieza
    descripcion: >
      Las letras, el marco y los palitos quedan unidos: el contorno engorda las letras y lo
      que queda suelto (tildes, puntos, palabras separadas) se une con puentes cortos.
    criterio: >
      Para varias combinaciones (tipografías cursivas y gruesas, 1 a 3 líneas, con y sin
      marco, contorno 0 a 6 mm) la región del topper es UNA sola componente conectada y la
      punta de arriba de cada palito queda adentro de esa región; con contorno 0 y palabras
      separadas hay al menos un puente y se avisa en el reporte.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-002
    titulo: Mallas cerradas y medidas pedidas
    descripcion: El topper es imprimible acostado, del ancho y grosor elegidos, con palitos con punta.
    criterio: >
      Cada pieza es una malla cerrada; el ancho del topper (sin marco) es el pedido ±1,5 mm y
      con marco no lo supera en más de 10 mm; el grosor es el pedido; hay 1 o 2 palitos
      que terminan en punta y bajan todos hasta `largo` mm por debajo de lo más bajo de la
      pieza (en un corazón se clavan cerca de la punta, no en los costados altos); en
      "dos colores" la base asoma al menos 2 mm alrededor.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-003
    titulo: Texto, tipografías y marcos
    descripcion: >
      Hasta 3 líneas de hasta 24 letras, cada una con su tipografía (16: 11 cursivas y 5
      gruesas, con acentos y ñ) y su tamaño; marcos círculo, corazón, flor, rombo y sol.
    criterio: >
      Las 16 tipografías traen A–Z, a–z, 0–9, acentos y Ñ y están en LICENCIAS.md; cada
      marco arma un topper válido; las líneas van centradas y una debajo de la otra
      (encimadas un poco); un carácter que la tipografía no tiene, más de 3 líneas o más
      de 24 letras se rechazan con un mensaje en español; sin texto da error.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-004
    titulo: Descargas del topper
    descripcion: STL de la base (y de las letras) y 3MF con base y letras como partes de un objeto.
    criterio: >
      export_stl da "Topper-<texto>_TOPPER.stl" (y _LETRAS.stl en dos colores); el 3MF tiene
      un objeto con un componente por pieza (base y letras ya encastradas) y la licencia en
      los metadatos; el nombre del archivo sale del texto sin acentos.
    prioridad: media
    nivel: motor
    estado: activa
  - id: TOP-005
    titulo: Página del topper y tarjeta en el inicio
    descripcion: >
      topper.html arma el topper con tu texto y lo muestra clavado en una torta (o plano,
      como se imprime); el inicio tiene la tarjeta "Topper para tortas" con su pop-up.
    criterio: >
      La página arranca con "Feliz / Cumpleaños" en Great Vibes, en una pieza y en la torta;
      escribir un nombre en la línea 3, cambiar a dos colores (aparece la malla LETRAS y el
      botón "STL letras") y elegir un marco recalculan; "Ver en la torta" alterna parado y
      plano; las descargas STL y 3MF funcionan; la tarjeta del inicio abre el pop-up con el
      link a topper.html; sin errores en la consola.
    prioridad: alta
    nivel: web
    estado: activa
  - id: TOP-006
    titulo: Más de un punto de apoyo entre líneas y letras
    descripcion: >
      Cada línea se apoya en la de abajo en al menos dos lugares separados (las líneas se
      enciman y, donde no se tocan, se agrega un pilar corto en la columna de menos luz);
      cada pieza suelta de más de 6 mm se une con dos puentes, no con uno.
    criterio: >
      Con 2 y 3 líneas (cursivas y gruesas), entre cada línea y la de abajo hay 2 o más
      apoyos, o un solo contacto que ocupa al menos el 40 % del ancho común; las palabras
      separadas (contorno 0) llevan 2 puentes cada una; la pieza sigue siendo una sola.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-007
    titulo: La torta con el topper y el modo cumpleaños
    descripcion: >
      La torta (bizcochuelo, cobertura, chorreado, granas y velitas) apoya en la mesa y el
      topper entra desde arriba y se clava; agregar un nombre no mueve la torta. "Modo
      cumpleaños" prende las velitas, tira dos ráfagas de confeti y sigue lloviendo confeti
      que se apoya en la torta y la mesa, con la cámara girando.
    criterio: >
      La base de la torta queda en la mesa (y = 0) y su cobertura a la misma altura con y
      sin nombre; con el nombre el topper es más alto; el topper baja (entrada animada) y
      termina con los palitos clavados un 60 % (menos en una torta baja, sin atravesarla);
      "🎉 Cumpleaños" prende 4 velas, tira 2
      ráfagas y el confeti cae y se apoya; al terminar se borra el confeti y se apagan las
      velas; sin errores en la consola.
    prioridad: media
    nivel: web
    estado: activa
  - id: TOP-008
    titulo: Los huecos de las letras quedan abiertos y el contorno es fino
    descripcion: >
      El contorno une las letras cerrando primero las luces entre ellas (cierre) y después
      engordándolas sólo lo pedido; los ojos de las letras (a, e, o, p, d, 8…) y lo que
      queda encerrado entre letras no se tapan. Las líneas se apilan por su perfil: se
      tocan donde se cruzan las letras, no se enciman las panzas.
    criterio: >
      Con "Happy / Birthday / Martina" en Lobster y "Feliz / Cumpleaños" en Great Vibes,
      todos los huecos de 0,5 mm² o más de las letras siguen abiertos en la pieza
      (huecos_abiertos == huecos > 0); el contorno por defecto es 0,4 mm; la pieza sigue
      siendo una sola.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-009
    titulo: Número de años en distintos estilos
    descripcion: >
      Un número de 1 a 3 cifras (los años que cumple) en cualquier tipografía, solo o con
      estrellas, corazones, corona o "años" abajo; sale aparte, en una pieza, con palitos,
      y comparte grosor, contorno, colores y largo de palitos con el topper.
    criterio: >
      Cada estilo arma una sola región con mallas cerradas, del alto pedido (el número),
      con 1 o 2 palitos con punta; letras o más de 3 cifras dan un error en español;
      export_stl da "Numero-<n>_NUMERO.stl" y el 3MF con el número activo trae dos objetos
      (topper y número) uno al lado del otro, cada uno con sus partes de color.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-010
    titulo: Dos colores en dos alturas o a la misma altura (AMS)
    descripcion: >
      "Dos alturas": la base entera y las letras en relieve arriba, para cualquier
      impresora pausando y cambiando el filamento a mano en esa capa. "Misma altura": las
      letras al ras de la base, de color en las últimas capas, para Bambu Lab con AMS u
      otra multicolor.
    criterio: >
      En dos alturas las letras van de grosor a grosor + letras y el reporte da la altura
      del cambio (= grosor); en misma altura todo mide el grosor pedido, las letras van de
      grosor − letras a grosor y el borde de esas capas tiene un agujero por cada letra;
      las mallas son cerradas en los dos modos, para el topper y para el número.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: TOP-011
    titulo: Distintas tortas, con el topper y el número clavados
    descripcion: >
      Se elige la torta (crema, chocolate, chocotorta, Oreo, pasta frola, rogel, frutillas
      o selva negra), con texturas dibujadas; el número de años va al lado del topper y
      los dos entran desde arriba y se clavan; el confeti se apoya en cualquier torta.
    criterio: >
      Cada tipo de torta apoya en la mesa con el topper y el número clavados (la parte de
      abajo de cada uno a la altura de la torta menos lo que entran los palitos), sin
      encimarse (el número a la derecha del topper); el modo cumpleaños en una torta
      rectangular apoya el confeti; sin errores en la consola.
    prioridad: media
    nivel: web
    estado: activa
