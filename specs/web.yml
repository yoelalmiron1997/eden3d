area: Página web
prefijo: WEB
specs:
  - id: WEB-001
    titulo: La página carga el catálogo completo
    descripcion: Al abrir la página se carga el motor y los controles.
    criterio: >
      El estado dice "Motor listo", el selector de diseño tiene los 17 diseños del
      catálogo y no hay errores en la consola.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-002
    titulo: Se ve la maceta en 3D
    descripcion: El visor muestra la maceta, el plato y el agua.
    criterio: >
      Después de generar hay mallas MACETA, PLATO y AGUA con más de 10.000 triángulos
      y el canvas no está vacío.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-003
    titulo: El reporte explica el autorriego
    descripcion: El cliente ve cuánta agua necesita y la rosca.
    criterio: >
      En autorriego el reporte muestra el SKU, "4 vueltas", la luz bajo la maceta y
      los ml para mojar la tierra y con el plato lleno.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-004
    titulo: Descargar el 3MF
    descripcion: Se puede bajar el archivo para imprimir.
    criterio: >
      El botón "Descargar 3MF" baja un archivo <SKU>.3mf que es un ZIP válido con
      2 objetos y el aviso de copyright en los metadatos.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-005
    titulo: Los sliders cambian el diseño
    descripcion: Tocar el patrón cambia la geometría y el nombre.
    criterio: Mover "Repeticiones" a 36 regenera la maceta y el SKU termina en -N36.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-006
    titulo: Se usa bien en el celular
    descripcion: La página entra en un celular sin scroll horizontal.
    criterio: >
      En 390×844 no hay scroll horizontal, el visor está arriba y los botones de
      descarga son visibles al bajar.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-007
    titulo: Vista de corte
    descripcion: Se puede ver la maceta cortada para entender el autorriego.
    criterio: Al activar "Corte" los materiales usan un plano de corte.
    prioridad: baja
    nivel: web
    estado: activa
  - id: WEB-008
    titulo: Descargar STL por pieza
    descripcion: Para laminadores que no usan 3MF.
    criterio: El botón "STL maceta" baja <SKU>_MACETA.stl con el encabezado de autoría.
    prioridad: baja
    nivel: web
    estado: activa
  - id: WEB-009
    titulo: Guía de uso en PDF
    descripcion: >
      Un botón genera un PDF con recomendaciones de uso de la maceta elegida: foto,
      medidas, cómo usar el autorriego con los ml reales, cuidados de cada planta, la
      tierra elegida y cómo cuidar la pieza de PLA.
    criterio: >
      "Guía PDF" descarga <SKU>_guia.pdf, un PDF A4 de al menos 2 páginas con la
      foto, los ml de agua mínima y plato lleno, la ficha de cada planta elegida y el
      cuidado del PLA, generado en el navegador.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-010
    titulo: Textos cortos y panel plegable en el celular
    descripcion: >
      En pantallas chicas el panel se ordena en secciones que se pliegan, con textos
      cortos, y la ficha de cuidados muestra primero lo esencial.
    criterio: >
      En 390×844 el orden es visor, panel y cuidados; las secciones Ambiente, Vista e
      Impresión 3D arrancan cerradas y se abren al tocar el título; los botones del
      panel tienen textos de hasta 14 letras; la ficha muestra autorriego, luz, riego
      y mascotas, y el resto queda en "Más cuidados".
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-011
    titulo: Cambiar de modelo mientras calcula
    descripcion: >
      Si se cambia el diseño o el tamaño mientras se calcula, no se pierde el cambio:
      antes quedaba la maceta vieja en pantalla y la tierra y la planta de la nueva
      (flotando sobre el borde).
    criterio: >
      Tras cambiar tamaño y diseño seguidos, el SKU en pantalla es el del último elegido
      y la tierra está a la altura de la boca de esa maceta.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-012
    titulo: Home "Herramientas para crear en 3D"
    descripcion: >
      La portada presenta las herramientas de TecnoBear para la comunidad de YouTube;
      la tarjeta del generador de macetas abre su pop-up.
    criterio: >
      La portada dice "Herramientas para crear en 3D" y tiene la tarjeta del generador de
      macetas con su imagen (render real de la maceta desarmada en el jardín); en la
      primera visita se abre el pop-up (después, al tocar la imagen de la tarjeta) y
      "Abrir el generador" lleva a macetas.html.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-013
    titulo: Modo claro y oscuro
    descripcion: >
      Un botón simple en el encabezado de todas las páginas (inicio y herramientas), con
      la luna en oscuro (el de la marca, por defecto) y el sol en claro; cada toque
      alterna y se recuerda para la próxima visita.
    criterio: >
      Sin elegir nada la página está en oscuro; el botón alterna claro y oscuro y cambia
      los colores de la página (inicio y herramientas); al recargar se mantiene el elegido.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-014
    titulo: Inicio industrial con catálogo, buscador y filtros
    descripcion: >
      Inicio rediseñado (estilo industrial, oscuro, acentos lima): navbar fijo con el logo
      original quieto, hero con el logo flotando suave (no gira) y las cuatro herramientas,
      catálogo con buscador y filtros por categoría, beneficios, planes Gratis y Premium
      y footer con YouTube e Instagram; las páginas de las herramientas usan el mismo
      encabezado y estilo; responsive sin scroll horizontal.
    criterio: >
      Las cuatro tarjetas llevan a sus rutas reales (macetas, mate, sopa, topper); el
      buscador (sin tildes) y los filtros funcionan juntos y el contador y el mensaje de
      "sin resultados" se actualizan; el logo es assets/marca/logo-tecnobear.svg (el original calcado a vector),
      ninguno gira, el del navbar está quieto y el del hero flota (nada con movimiento
      reducido); el plan Premium (actualizaciones más directas, sin marca de agua, render y
      PDF con consideraciones, que el gratis no tiene; colecciones, próximamente) lleva a
      Instagram y "Crear cuenta gratis" abre el registro; en 390 px el menú hamburguesa
      abre y cierra y no hay scroll horizontal en 390, 768 y 1440 px (tampoco en las
      herramientas, que muestran el logo original); el login y el tema siguen andando; sin
      errores en la consola.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-015
    titulo: Pantalla de carga de cada motor con una impresora 3D
    descripcion: >
      Mientras se baja Python, se carga el motor y se arma la primera vista previa, el
      visor de cada herramienta muestra una impresora 3D (vector propio) imprimiendo la
      pieza de esa herramienta (maceta, mate, pieza de la sopa o topper) capa por capa,
      con una barra de carga y sin textos a la vista.
    criterio: >
      En macetas, mate, sopa y topper aparece la pantalla de carga con la impresora y la
      pieza de su motor y la barra (sin textos a la vista; la barra avanza cuando el
      worker avisa que Python está listo); desaparece sola después de la primera vista
      previa; no bloquea clics.
    prioridad: media
    nivel: web
    estado: activa
  - id: WEB-016
    titulo: Render y PDF con consideraciones, sólo Premium
    descripcion: >
      Cada motor (macetas, mate, sopa, topper) hace un render (Foto) y un PDF con las
      consideraciones de impresión (la guía de las macetas; en mate, sopa y topper, la
      pieza, sus datos y cómo imprimirla). Son del plan Premium (cuenta Pro o admin):
      con una cuenta gratis el botón muestra "Pro" y explica el plan; sin cuentas
      configuradas todo es libre.
    criterio: >
      Con una cuenta "usuario", Foto y Guía PDF muestran "Pro" y al tocarlos se abre el
      aviso Premium (con el link a Instagram) sin descargar nada; con una cuenta "pro"
      no hay candado, la foto baja en 1080×1350 y el PDF baja como
      <sku>_consideraciones.pdf (mate, sopa, topper) con el render y las
      consideraciones de impresión.
    prioridad: alta
    nivel: web
    estado: activa
  - id: WEB-017
    titulo: La vista 3D se mira desde todos los ángulos
    descripcion: >
      En todas las herramientas la cámara gira libre (también por debajo de la pieza) y
      hay botones de vista: frente, atrás, izquierda, derecha, arriba, abajo, 3/4 y girar
      360°. Mirando desde abajo se esconden la mesa, el escenario y el piso (y la torta del
      topper) para ver la pieza por debajo.
    criterio: >
      En macetas, mate, sopa, topper y chapitas la barra de vistas tiene sus 8 botones; la
      cámara no tiene límite de ángulo hacia abajo; "Abajo" deja la cámara por debajo de la
      mesa y esconde el piso y el escenario, "Arriba" la lleva arriba y los vuelve a mostrar;
      "360°" prende y apaga el giro; sin errores en la consola.
    prioridad: media
    nivel: web
    estado: activa
