area: Cuentas, roles y administración
prefijo: CUE
specs:
  - id: CUE-001
    titulo: Ingresar con cuenta (Supabase)
    descripcion: >
      La web tiene login con email y contraseña (Supabase): crear cuenta, ingresar,
      recuperar la contraseña y salir. Cada cuenta tiene un rol: usuario, pro (paquete
      extra) o admin. Sin Supabase configurado la web sigue andando sin cuentas.
    criterio: >
      Con cuentas configuradas aparece "Ingresar"; al ingresar se ve el email y el rol
      y "Salir" vuelve a visitante; la URL y la clave pública salen de las variables del
      repositorio al armar la web; sin configurar no hay botón y se descarga libre.
    prioridad: alta
    nivel: web
    estado: activa
  - id: CUE-002
    titulo: Descargas para cuentas registradas
    descripcion: Con cuentas activas, para bajar los archivos de impresión hay que ingresar.
    criterio: >
      Un visitante que toca 3MF o STL ve la ventana de ingreso y no se descarga nada;
      un usuario descarga normalmente.
    prioridad: alta
    nivel: web
    estado: activa
  - id: CUE-003
    titulo: Reglas de la base (nadie se da un rol solo)
    descripcion: >
      Los roles los protege la base de datos (RLS), no la página: cada cuenta nueva es
      'usuario', cada uno ve sólo su perfil y sólo un admin cambia roles.
    criterio: >
      supabase/esquema.sql activa RLS en perfiles, crea el perfil 'usuario' al
      registrarse, permite UPDATE sólo con es_admin(), impide que un admin se quite el
      rol, y los roles coinciden con los de la web; el repositorio no guarda claves.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: CUE-004
    titulo: Panel de administrador
    descripcion: >
      admin.html, sólo para administradores: lista de cuentas con su rol (usuario, pro,
      admin) para dar o sacar el paquete Pro, y cobertura de la marca de agua en cada
      maceta con un texto a elección.
    criterio: >
      Un no-admin ve "Sólo administradores"; el admin ve las cuentas y puede cambiar el
      rol de otra (no el propio); la cobertura arma cada maceta con el texto, revisa que
      las mallas queden cerradas, muestra dónde entra la marca y baja un CSV.
    prioridad: alta
    nivel: web
    estado: activa
  - id: CUE-005
    titulo: Calidad y cobertura sólo para el administrador
    descripcion: >
      Los links a Calidad y Specs, el tablero de calidad y la cobertura son internos:
      los ve el administrador, no el resto.
    criterio: >
      Para visitante y usuario no aparecen los links de Calidad/Specs y /calidad/ dice
      "Sólo administradores"; el admin ve los links y el tablero. Sin cuentas
      configuradas los links no se muestran y el tablero queda como antes.
    prioridad: alta
    nivel: web
    estado: activa
  - id: CUE-006
    titulo: Menú de la cuenta y perfil con foto
    descripcion: >
      Con la sesión iniciada, el encabezado muestra un botón redondo con la foto o las
      iniciales; abre un menú con el nombre, el email, el rol, "Mi perfil", la
      administración (sólo admin) y "Salir". El perfil guarda nombre, apellido, fecha de
      nacimiento y una foto (achicada a 96 × 96) en los metadatos de la cuenta.
    criterio: >
      Sin perfil el botón muestra las iniciales; al guardar nombre, apellido, fecha y foto
      el botón muestra la foto de 96 × 96, el menú el nombre y al volver a abrir el perfil
      están los datos; "Salir" desde el menú cierra la sesión; sin errores en la consola.
    prioridad: media
    nivel: web
    estado: activa
  - id: CUE-007
    titulo: Perfil con dónde vive, oficio y una imagen prediseñada
    descripcion: >
      Además de nombre, apellido, nacimiento y foto, el perfil guarda ciudad, provincia o
      país, oficio, impresora 3D, usuario de Instagram y unas líneas "Sobre vos". En vez de
      subir una foto se puede elegir una de 16 imágenes minimalistas prediseñadas (oso,
      perro, gato, patita, impresora 3D, mate…), que se guardan como "av:<id>".
    criterio: >
      Elegir una imagen prediseñada la marca elegida y la muestra en el perfil y en el botón
      de la cuenta; ciudad, provincia, oficio, impresora, Instagram (sin la @) y "Sobre vos"
      se guardan y vuelven al abrir el perfil; un Instagram con caracteres inválidos se
      rechaza con un mensaje en español; sin errores en la consola.
    prioridad: media
    nivel: web
    estado: activa
  - id: CUE-008
    titulo: Feedback de la comunidad
    descripcion: >
      Un botón "Feedback" en todas las páginas abre el feedback de la comunidad: con la
      sesión iniciada se elige el tipo (idea, algo no anda, comentario), la herramienta y se
      escribe la descripción; la lista muestra lo de todos con su nombre, oficio, ciudad e
      imagen; se puede sumar ("Me sumo"), responder, filtrar por tipo y borrar lo propio; el
      admin marca resuelto y borra. Sin sesión pide ingresar; sin cuentas configuradas el
      botón no aparece.
    criterio: >
      Sin cuentas no hay botón; un visitante ve el aviso para ingresar; con sesión, enviar
      una idea la suma arriba de la lista con el nombre y el oficio · ciudad del perfil, la
      herramienta de la página elegida sola; "Me sumo" cuenta 1 y se puede sacar; una
      respuesta aparece debajo; el filtro "Algo no anda" muestra sólo esos; borrar pide
      confirmar con un segundo toque; un usuario no ve "Marcar resuelto" y el admin sí; menos
      de 3 caracteres da un error en español; sin errores en la consola.
    prioridad: alta
    nivel: web
    estado: activa
  - id: CUE-009
    titulo: Las reglas del feedback viven en la base
    descripcion: >
      supabase/esquema.sql crea las tablas feedback, feedback_respuestas y feedback_votos con
      RLS: las leen las cuentas; cada uno escribe sólo a su nombre (autor = auth.uid());
      cada uno borra lo suyo y el admin todo; sólo el admin cambia el estado.
    criterio: >
      El esquema se puede correr dos veces; las tres tablas tienen RLS activado y políticas
      de select para authenticated, insert con autor = auth.uid(), delete del autor o admin
      y update del feedback sólo para es_admin(); los límites de largo y los tipos válidos
      están en checks de la base.
    prioridad: alta
    nivel: motor
    estado: activa
