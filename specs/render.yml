area: Render para Instagram (Rhino)
prefijo: REN
specs:
  - id: REN-001
    titulo: Fondos de naturaleza desenfocados
    descripcion: Los fondos del render tienen formato Instagram y se ven fuera de foco.
    criterio: >
      Cada fondo es 1080×1350, tiene metadatos (suelo entre 0,7 y 0,9, tema claro u
      oscuro) y su energía de alta frecuencia (varianza del laplaciano a 1/4) es <45.
    prioridad: media
    nivel: render
    estado: activa
  - id: REN-002
    titulo: Escena de la foto sana
    descripcion: Planta, piedritas y tierra que se agregan para la foto.
    criterio: >
      Las mallas no tienen triángulos degenerados y la tierra y las piedras quedan
      dentro de la boca de la maceta.
    prioridad: media
    nivel: render
    estado: activa
  - id: REN-003
    titulo: Render de producto en la web
    descripcion: Generar la foto de producto (fondo + planta) directamente en la página.
    criterio: >
      Botón "Foto" que descarga un PNG 1080×1350 con la maceta, las plantas y el
      escenario elegido sobre un fondo.
    prioridad: baja
    nivel: web
    estado: activa
  - id: REN-004
    titulo: Foto de producto con más calidad
    descripcion: >
      La foto (botón Foto y la imagen del PDF) se dibuja al doble de resolución y se achica
      con el mejor filtro del navegador: bordes, cadenas y relieves sin serrucho. En un
      equipo que el visor pasó a bajos recursos igual sale con sombras, piso y reflejos.
    criterio: >
      La foto sale del tamaño pedido, dibujada a escala 2 (o lo que permita la placa) y,
      en bajos recursos, completa; después el visor vuelve a quedar como estaba.
    prioridad: media
    nivel: web
    estado: activa
