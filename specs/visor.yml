area: Visor 3D
prefijo: VIS
specs:
  - id: VIS-001
    titulo: Iluminación ajustable
    descripcion: Presets de luz (estudio, mañana, atardecer, noche) y dirección del sol.
    criterio: >
      Cada preset cambia la luz principal (color/intensidad o lámpara) y el fondo del
      visor; el control de dirección mueve el sol.
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-002
    titulo: Agua con olas, interactiva y con gotas
    descripcion: >
      El agua del autorriego tiene olas y vaivén, y se puede tocar: al tocarla cae una
      gota que salpica y abre ondas que rebotan en el borde del plato; hay botón de
      gota, de "hacer olas" y lluvia. Se llena hasta el nivel elegido.
    criterio: >
      La superficie cambia con el tiempo con un relieve de al menos 0,5 mm; tocar el
      agua en el visor hace caer una gota que impacta (salpicadura y onda simulada);
      la lluvia agrega gotas seguidas; "hacer olas" aumenta el vaivén; el nivel
      converge (±0,6 mm) al "mínimo para mojar" o al "plato lleno" del motor.
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-003
    titulo: Funciona en equipos sin placa de video
    descripcion: En equipos lentos el visor baja la calidad en vez de congelar la página.
    criterio: >
      En modo de bajo consumo se apagan sombras y reflejos, se limitan los cuadros por
      segundo y la animación del agua sigue avanzando.
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-004
    titulo: Escenarios de oficina, jardín y taller
    descripcion: >
      Además del estudio, la maceta se puede ver sobre un escritorio de oficina, en un
      jardín (mesa de madera al aire libre con una foto real de jardín desenfocada
      atrás, de Poly Haven, CC0) o sobre un banco de taller de trabajo (con impresora 3D).
    criterio: >
      Oficina y taller agregan su ambiente (escritorio o banco de trabajo), ocultan el
      piso de sombra del estudio y se escalan con la maceta; el jardín pone la mesa de
      madera (texturas de color, relieve y rugosidad) y la foto del jardín como fondo
      desenfocado y luz ambiente, con la cámara baja; al volver a Estudio se quita todo.
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-005
    titulo: Plantas que nacen y se mueven con el viento
    descripcion: >
      Al elegir una planta crece desde la tierra; todas se balancean con el viento
      según qué tan flexibles son (un cactus casi no se mueve, una colgante sí).
    criterio: >
      El motor entrega cada planta por separado con su punto de nacimiento y su
      flexibilidad; en la web una planta nueva arranca casi en escala 0 y llega a 1 en
      menos de 4 s, las que ya estaban no vuelven a nacer y el tiempo del viento avanza
      (se puede apagar).
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-006
    titulo: Separar las piezas (despiece animado)
    descripcion: >
      Un control separa plato, agua, maceta, tierra y plantas para ver cómo encajan;
      "Animar" lo arma y desarma en loop, girando la cámara y nombrando cada pieza.
    criterio: >
      Al 100 % la maceta sube casi su altura completa, la tierra sube por encima y las
      plantas más arriba; el plato no se mueve; aparecen etiquetas de cada pieza; en
      loop la separación va y vuelve sola; al 0 % vuelve a estar armada.
    prioridad: media
    nivel: web
    estado: activa
  - id: VIS-007
    titulo: Modo slicer (capa por capa)
    descripcion: >
      Vista como la de un programa de laminado: la pieza sola sobre la cama de la
      impresora, cortada en la capa elegida, con la capa actual resaltada y su
      contorno; "Imprimir" muestra el cabezal de la impresora recorriendo el contorno
      de cada capa.
    criterio: >
      Con capas de 0,2 mm la cantidad de capas es la altura de la pieza / 0,2; al
      elegir la capa n el corte queda a n × 0,2 mm, hay contorno de esa capa, se puede
      elegir maceta o plato; "Imprimir" avanza las capas solo con el cabezal
      siguiendo el recorrido continuo de cada capa; al salir vuelve la vista normal.
    prioridad: media
    nivel: web
    estado: activa
