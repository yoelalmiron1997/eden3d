area: Mate con hueco
prefijo: MAT
specs:
  - id: MAT-001
    titulo: El hueco es exacto para el inserto
    descripcion: >
      El hueco del mate copia el polímero escalonado y el polímero base tal cual vienen en sus
      STL, para que el inserto entre justo.
    criterio: >
      El perfil que el motor lee de Polimero_Mate.stl y Adaptador_Polimero_2.stl coincide
      con el perfil incluido (±0,05 mm) y el volumen del inserto reconstruido difiere del
      STL en menos de 1 %. Con holgura h el hueco es h mm más ancho y más hondo.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-002
    titulo: Todos los mates salen cerrados e imprimibles
    descripcion: Cada modelo, con cada inserto, es una malla cerrada lista para el laminador.
    criterio: >
      Los 17 modelos con polímero, adaptador y los dos juntos dan mallas cerradas y bien
      orientadas (cada pieza), con volumen positivo y sin errores.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-003
    titulo: El mate se agranda solo hasta la pared pedida
    descripcion: >
      Si el inserto no entra con la pared mínima, el mate crece (alto y ancho) en vez de
      quedar con paredes finas o con el hueco afuera.
    criterio: >
      Con autoajuste, la pared mínima medida es ≥ la pedida (−0,05 mm) y el fondo ≥ el
      pedido en todos los modelos; sin autoajuste y con un mate chico el reporte avisa o
      da error (nunca dice "válido" con el hueco afuera).
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-004
    titulo: Hueco para los dos insertos juntos
    descripcion: La opción "Los dos juntos" hace un solo hueco donde entran ambos.
    criterio: >
      A cada profundidad, el radio del hueco "ambos" es el mayor de los dos insertos
      (contiene a los dos) y su profundidad es la del más hondo.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-005
    titulo: Se puede usar el STL de un inserto propio
    descripcion: >
      La persona sube el STL de su vaso o adaptador y el motor le hace el hueco; si el
      archivo no sirve, se lo explica.
    criterio: >
      Un STL de revolución (binario o ASCII) se acepta y da el mismo hueco que el inserto
      incluido; una caja o un archivo roto se rechaza con un mensaje en español, sin
      romper la página.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-006
    titulo: Descarga en STL y 3MF con licencia
    descripcion: Los archivos para imprimir llevan el nombre del modelo y la licencia.
    criterio: >
      export_stl y export_3mf devuelven archivos válidos con el nombre Mate-<MODELO>-<INSERTO>;
      el 3MF trae Copyright y LicenseTerms en los metadatos.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-007
    titulo: El motor del mate responde rápido
    descripcion: Cambiar de modelo o de inserto no hace esperar.
    criterio: En CPython, cualquier modelo con cualquier inserto tarda < 3 s en vista previa.
    prioridad: media
    nivel: rendimiento
    estado: activa
  - id: MAT-008
    titulo: La página del mate carga y muestra el mate con el inserto
    descripcion: mate.html carga el motor en el navegador y dibuja el mate y el inserto.
    criterio: >
      El estado dice "Listo", el selector tiene los 17 modelos y los 4 insertos, el visor
      tiene las mallas MACETA e INSERTO, se ve el canvas y no hay errores de consola.
      Cambiar de modelo recalcula y cambia el SKU.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-009
    titulo: Descargas y STL propio desde la web
    descripcion: Desde la página se baja el STL/3MF y se puede subir un inserto propio.
    criterio: >
      El botón STL descarga un archivo Mate-*.stl; al subir el STL del polímero el mate se
      recalcula con "Mi archivo STL" y al subir un archivo que no sirve aparece el error.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-010
    titulo: La herramienta aparece en el inicio
    descripcion: El inicio de TecnoBear muestra la tarjeta "Mate con hueco".
    criterio: >
      La tarjeta tool-mate tiene su imagen y al tocarla abre el pop-up con el link a
      mate.html.
    prioridad: media
    nivel: web
    estado: activa
  - id: MAT-011
    titulo: Nombres de los insertos
    descripcion: Los insertos se llaman como en el negocio.
    criterio: >
      El vaso se llama "Polímero escalonado" y el adaptador "Polímero base", en el motor,
      en el selector de la página y en el reporte.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-012
    titulo: Marca de agua grabada debajo de la base
    descripcion: >
      Cada mate lleva grabada debajo de la base la marca Eden3D (se lee dando vuelta el
      mate); con el paquete Pro se cambia por otro texto.
    criterio: >
      En los 17 modelos la marca por defecto es "Eden3D", queda hundida 0,6 mm en la
      base (que sigue siendo una malla cerrada) y, si no entra, se avisa; un texto
      propio (acentos, ñ, signos) se graba igual; "" la saca; un carácter que no se
      puede grabar da error claro. En la web el campo está bloqueado con candado "Pro"
      para usuarios y se aplica para Pro.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-013
    titulo: Texto o SVG proyectado en relieve
    descripcion: >
      Se proyecta un texto o un SVG (rellenos y trazos: path, rect, circle, ellipse,
      polygon, polyline, line, grupos y transform) sobre la piel del mate como un sólido
      que sobresale, en la posición, tamaño, rotación y profundidad elegidos.
    criterio: >
      El relieve es una malla cerrada que sobresale la profundidad pedida (±0,1 mm) en el
      ángulo y la altura pedidos (±1° y ±0,5 mm) y sigue la curvatura (su base queda
      0,8 mm adentro de la pared); funciona en los 17 modelos; un SVG inválido, sin
      figuras o demasiado grande se rechaza con un mensaje en español; el reporte del
      mate sigue "válido" y "cerrado".
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-014
    titulo: Cuña para armar la montañita
    descripcion: >
      Pieza extra que sostiene el mate inclinado (45° por defecto, de 10° a 45°) con un
      hueco a la medida del pie, para armar la montañita de yerba.
    criterio: >
      La cuña es una malla cerrada con la cara de arriba inclinada el ángulo pedido
      (±0,5°) y un hueco más ancho que el pie del mate; sale como objeto aparte en el
      3MF y como "…_CUNA.stl".
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-015
    titulo: Relieve con gumball en la web
    descripcion: >
      En mate.html se elige texto o SVG, se ve el relieve en el mate y se acomoda con un
      gumball (mover sobre la superficie, girar y escalar) o con los controles. Mientras
      se arrastra, el relieve se vuelve a apoyar sobre la piel real en cada cuadro (no
      queda flotando ni enterrado donde el mate cambia de ancho, como en el labio).
    criterio: >
      Elegir "Texto" muestra la malla RELIEVE y el gumball; arrastrar el gumball (mover)
      cambia el ángulo y la altura y recalcula; durante el arrastre y después de soltar,
      todos los vértices del relieve quedan entre 0,8 mm adentro y la profundidad pedida
      afuera de la piel (±0,05 mm), también al subirlo al labio del modelo Labio grueso;
      girar cambia la rotación; escalar cambia el tamaño; subir un SVG lo proyecta; la
      cuña se ve y se descarga en STL.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-016
    titulo: Siete modelos nuevos de las fotos de referencia
    descripcion: >
      Triangular, Con patitas, Low poly torcido, Vaso cónico, Low poly irregular, Labio
      grueso y Cubos 3D, con la forma que se ve en las fotos y todo lo demás (hueco,
      autoajuste, relieve, marca y cuña) igual que en los otros modelos.
    criterio: >
      Triangular tiene 3 lóbulos a media altura; Con patitas tiene 4 patas en la base
      (entre dos patas al frente) y es redondo arriba de ellas; los low poly son caras
      planas (cada corte es un polígono de 2n lados) que giran con la altura, el
      irregular siempre igual con la misma semilla; el cónico se abre de abajo hacia
      arriba con un anillo en la base; el de labio grueso tiene el labio más ancho que el
      cuello; Cubos 3D tiene un relieve de 3 mm que se repite 10 veces alrededor.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-017
    titulo: Los modelos salen lisos, sin círculos
    descripcion: >
      Ningún modelo de fábrica trae círculos rebajados (medallones): el lugar para un
      diseño lo hace el medallón encastrable sólo cuando se lo pide.
    criterio: >
      Ningún modelo tiene "medallones" en sus extras; Vaso redondeado y Labio grueso son
      de revolución (cada fila con un solo radio); sin relieve ni medallón, la piel del
      frente de Con patitas y Facetado no tiene rebajes (la misma piel que sin el extra).
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-018
    titulo: Tipografías gruesas para el texto en relieve
    descripcion: >
      El texto del relieve se puede poner en 9 tipografías (la de trazos de Eden3D y 8
      libres, gruesas, fáciles de imprimir) y se puede engordar hasta 1,5 mm.
    criterio: >
      Las 8 tipografías libres traen A–Z, a–z, 0–9, acentos y Ñ, figuran con su licencia
      (OFL o Apache) en fuentes/LICENCIAS.md, y con cada una el relieve sale cerrado; la
      tipografía por defecto (Archivo Black) cubre más superficie que la de trazos con el
      mismo texto y alto; un carácter que no está en la tipografía se rechaza con un
      mensaje en español; con grosor g el relieve es 2·g (±0,3 mm) más ancho y más alto.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-019
    titulo: Medallón encastrable
    descripcion: >
      El texto o el SVG puede ir en un medallón circular aparte: el mate lleva un
      bolsillo (la diferencia con la pieza, proyectada sobre la piel, con fondo plano) y
      la pieza encastra en él. La pieza se imprime con la base plana en la cama.
    criterio: >
      Con medallón: el mate y la pieza son mallas cerradas; ningún punto de la pieza en su
      lugar queda adentro de la pared del mate (±0,01 mm); el bolsillo tiene al menos el
      diámetro pedido en el fondo y al menos la profundidad pedida; el juego queda entre la
      holgura y holgura + 0,8 mm; el diseño entra en el disco (se achica si hace falta y
      lo avisa); la pieza en la cama apoya plana en z = 0; se descarga como
      "…_MEDALLON.stl" y va como objeto aparte en el 3MF; el relieve ya no se suma al mate.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-020
    titulo: Tipografías y medallón en la web
    descripcion: >
      En mate.html se elige la tipografía y el grosor del texto, y se activa el medallón
      encastrable con su diámetro y holgura; la pieza se ve en su lugar y se descarga.
    criterio: >
      El selector de tipografía tiene las 9 y cambiarla recalcula con esa fuente; el grosor
      se manda al motor; tildar "En un medallón encastrable" muestra la malla MEDALLON, el
      mensaje con el juego y el botón "STL medallón", que baja "…_MEDALLON.stl"; sin
      errores en la consola.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-021
    titulo: Cebar el mate (yerba, montañita y agua animadas)
    descripcion: >
      En mate.html, "Cebar el mate" anima la yerba que cae adentro del inserto, el mate
      que se inclina para armar la montañita y se vuelve a parar, el agua caliente que
      entra por el costado bajo (agua interactiva como la del plato de las macetas: gotas,
      olas y ondas al tocarla), la bombilla y el vapor. "Separar" saca el inserto con todo
      adentro (con animación en loop, como el despiece de las macetas). El agua es
      transparente y la bombilla tiene el estilo de las bombillas argentinas (filtro de
      resorte, cuadrado, cuchara o pala; caña apenas curva, virola y pico chato abierto).
    criterio: >
      El selector de bombilla tiene 5 estilos (resorte, resorte de color, filtro cuadrado,
      cuchara y pala) y cambiarlo cambia la bombilla del mate; el agua es casi incolora
      (diferencia entre canales de color < 0,15) y translúcida (opacidad < 0,5). Tocar "Cebar el mate" pasa por las fases llenar → montañita (el mate se inclina) →
      cebar (sube el agua) → bombilla → listo, con la malla CEBADO en la escena; al
      terminar, el agua queda debajo de la cima de la montañita y la bombilla y el vapor
      se ven; "Gota" tira una gota; la montañita más empinada deja el agua más baja;
      "Separar" al 100 % sube el inserto y su contenido y "Animar" lo hace en loop; sin
      yerba ni agua la escena es la de siempre (MACETA e INSERTO); sin errores.
    prioridad: media
    nivel: web
    estado: activa
  - id: MAT-022
    titulo: Hueco del inserto para la animación del cebado
    descripcion: >
      El motor le pasa a la web el espacio libre adentro del inserto (donde van la yerba
      y el agua) a cada altura.
    criterio: >
      Para el polímero escalonado, el polímero base, los dos y un STL propio, la cavidad
      va del fondo (3 mm sobre el fondo del inserto) a la boca del mate, cada 1 mm, y su
      radio queda siempre adentro del inserto (al menos 2 mm menos que su radio exterior a
      esa altura y a 4,5 mm por debajo).
    prioridad: media
    nivel: motor
    estado: activa
