area: Mate con hueco
prefijo: MAT
specs:
  - id: MAT-001
    titulo: El hueco es exacto para el inserto
    descripcion: >
      El hueco del mate copia el polímero escalonado y el polímero base tal cual vienen en sus
      STL, para que el inserto entre justo.
    criterio: >
      El perfil que el motor lee de Polimero_Mate.stl y Adaptador_Polimero_2.stl coincide
      con el perfil incluido (±0,05 mm) y el volumen del inserto reconstruido difiere del
      STL en menos de 1 %. Con holgura h el hueco es h mm más ancho y más hondo.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-002
    titulo: Todos los mates salen cerrados e imprimibles
    descripcion: Cada modelo, con cada inserto, es una malla cerrada lista para el laminador.
    criterio: >
      Los 10 modelos con polímero, adaptador y los dos juntos dan mallas cerradas y bien
      orientadas (cada pieza), con volumen positivo y sin errores.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-003
    titulo: El mate se agranda solo hasta la pared pedida
    descripcion: >
      Si el inserto no entra con la pared mínima, el mate crece (alto y ancho) en vez de
      quedar con paredes finas o con el hueco afuera.
    criterio: >
      Con autoajuste, la pared mínima medida es ≥ la pedida (−0,05 mm) y el fondo ≥ el
      pedido en todos los modelos; sin autoajuste y con un mate chico el reporte avisa o
      da error (nunca dice "válido" con el hueco afuera).
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-004
    titulo: Hueco para los dos insertos juntos
    descripcion: La opción "Los dos juntos" hace un solo hueco donde entran ambos.
    criterio: >
      A cada profundidad, el radio del hueco "ambos" es el mayor de los dos insertos
      (contiene a los dos) y su profundidad es la del más hondo.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-005
    titulo: Se puede usar el STL de un inserto propio
    descripcion: >
      La persona sube el STL de su vaso o adaptador y el motor le hace el hueco; si el
      archivo no sirve, se lo explica.
    criterio: >
      Un STL de revolución (binario o ASCII) se acepta y da el mismo hueco que el inserto
      incluido; una caja o un archivo roto se rechaza con un mensaje en español, sin
      romper la página.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-006
    titulo: Descarga en STL y 3MF con licencia
    descripcion: Los archivos para imprimir llevan el nombre del modelo y la licencia.
    criterio: >
      export_stl y export_3mf devuelven archivos válidos con el nombre Mate-<MODELO>-<INSERTO>;
      el 3MF trae Copyright y LicenseTerms en los metadatos.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-007
    titulo: El motor del mate responde rápido
    descripcion: Cambiar de modelo o de inserto no hace esperar.
    criterio: En CPython, cualquier modelo con cualquier inserto tarda < 3 s en vista previa.
    prioridad: media
    nivel: rendimiento
    estado: activa
  - id: MAT-008
    titulo: La página del mate carga y muestra el mate con el inserto
    descripcion: mate.html carga el motor en el navegador y dibuja el mate y el inserto.
    criterio: >
      El estado dice "Listo", el selector tiene los 10 modelos y los 4 insertos, el visor
      tiene las mallas MACETA e INSERTO, se ve el canvas y no hay errores de consola.
      Cambiar de modelo recalcula y cambia el SKU.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-009
    titulo: Descargas y STL propio desde la web
    descripcion: Desde la página se baja el STL/3MF y se puede subir un inserto propio.
    criterio: >
      El botón STL descarga un archivo Mate-*.stl; al subir el STL del polímero el mate se
      recalcula con "Mi archivo STL" y al subir un archivo que no sirve aparece el error.
    prioridad: alta
    nivel: web
    estado: activa
  - id: MAT-010
    titulo: La herramienta aparece en el inicio
    descripcion: El inicio de TecnoBear muestra la tarjeta "Mate con hueco".
    criterio: >
      La tarjeta tool-mate tiene su imagen y al tocarla abre el pop-up con el link a
      mate.html.
    prioridad: media
    nivel: web
    estado: activa
  - id: MAT-011
    titulo: Nombres de los insertos
    descripcion: Los insertos se llaman como en el negocio.
    criterio: >
      El vaso se llama "Polímero escalonado" y el adaptador "Polímero base", en el motor,
      en el selector de la página y en el reporte.
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-012
    titulo: Marca de agua grabada debajo de la base
    descripcion: >
      Cada mate lleva grabada debajo de la base la marca Eden3D (se lee dando vuelta el
      mate); con el paquete Pro se cambia por otro texto.
    criterio: >
      En los 10 modelos la marca por defecto es "Eden3D", queda hundida 0,6 mm en la
      base (que sigue siendo una malla cerrada) y, si no entra, se avisa; un texto
      propio (acentos, ñ, signos) se graba igual; "" la saca; un carácter que no se
      puede grabar da error claro. En la web el campo está bloqueado con candado "Pro"
      para usuarios y se aplica para Pro.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-013
    titulo: Texto o SVG proyectado en relieve
    descripcion: >
      Se proyecta un texto o un SVG (rellenos y trazos: path, rect, circle, ellipse,
      polygon, polyline, line, grupos y transform) sobre la piel del mate como un sólido
      que sobresale, en la posición, tamaño, rotación y profundidad elegidos.
    criterio: >
      El relieve es una malla cerrada que sobresale la profundidad pedida (±0,1 mm) en el
      ángulo y la altura pedidos (±1° y ±0,5 mm) y sigue la curvatura (su base queda
      0,8 mm adentro de la pared); funciona en los 10 modelos; un SVG inválido, sin
      figuras o demasiado grande se rechaza con un mensaje en español; el reporte del
      mate sigue "válido" y "cerrado".
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAT-014
    titulo: Cuña para armar la montañita
    descripcion: >
      Pieza extra que sostiene el mate inclinado (45° por defecto, de 10° a 45°) con un
      hueco a la medida del pie, para armar la montañita de yerba.
    criterio: >
      La cuña es una malla cerrada con la cara de arriba inclinada el ángulo pedido
      (±0,5°) y un hueco más ancho que el pie del mate; sale como objeto aparte en el
      3MF y como "…_CUNA.stl".
    prioridad: media
    nivel: motor
    estado: activa
  - id: MAT-015
    titulo: Relieve con gumball en la web
    descripcion: >
      En mate.html se elige texto o SVG, se ve el relieve en el mate y se acomoda con un
      gumball (mover sobre la superficie, girar y escalar) o con los controles.
    criterio: >
      Elegir "Texto" muestra la malla RELIEVE y el gumball; arrastrar el gumball (mover)
      cambia el ángulo y la altura y recalcula; girar cambia la rotación; escalar cambia
      el tamaño; subir un SVG lo proyecta; la cuña se ve y se descarga en STL.
    prioridad: alta
    nivel: web
    estado: activa
