area: Historial de cambios
prefijo: HIS
specs:
  - id: HIS-001
    titulo: Deshacer y rehacer en los generadores
    descripcion: >
      Cada modelo que arma el motor es un paso. Arriba a la izquierda del visor hay
      deshacer (↶) y rehacer (↷), y también Ctrl+Z, Ctrl+Shift+Z y Ctrl+Y (⌘ en Mac).
      Vuelven los valores del modelo y el estado propio de cada página (la forma de la
      chapita, la figura del trofeo, la semilla de la sopa, el relieve y la marca del mate)
      y se vuelve a armar, sin crear un paso nuevo. Los colores, el escenario y las plantas
      no son parte del historial. En un campo de texto, Ctrl+Z deshace lo escrito como
      siempre. Un cambio nuevo después de deshacer descarta lo que se podía rehacer.
    criterio: >
      En los 7 generadores: dos cambios, deshacer dos veces vuelve exactamente a los
      valores de cada paso, rehacer vuelve al siguiente, Ctrl+Z y Ctrl+Y hacen lo mismo
      fuera de los campos de texto, y los botones se apagan cuando no hay nada para hacer.
    prioridad: alta
    nivel: web
    estado: activa
  - id: HIS-002
    titulo: Volver a los valores por defecto
    descripcion: >
      El botón "Default" vuelve a los datos con los que arrancó el generador (el primer
      modelo armado) como un paso más del historial, así que se puede deshacer.
    criterio: >
      Después de cambios, "Default" deja los mismos valores que al cargar la página y
      Ctrl+Z vuelve a lo que había antes; con los datos de arranque el botón está apagado.
    prioridad: alta
    nivel: web
    estado: activa
  - id: HIS-003
    titulo: Cubo de orientación y vista inicial
    descripcion: >
      Arriba a la derecha del visor, un cubo que gira con la cámara muestra desde dónde se
      mira la pieza (frente, atrás, izquierda, derecha, arriba, abajo); tocando una cara la
      cámara va a esa vista. Debajo, ⌂ vuelve en un vuelo corto al encuadre automático del
      modelo (y corta el 360°) y 360° hace girar la cámara.
    criterio: >
      El cubo sigue a la cámara (desde arriba se ve la cara "Arriba" de frente); cada cara
      lleva a su vista; después de mover la cámara, ⌂ la deja en la posición y el punto de
      mira del encuadre del modelo.
    prioridad: media
    nivel: web
    estado: activa
