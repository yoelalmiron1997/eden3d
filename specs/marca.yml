area: Marca de agua personalizada
prefijo: MAR
specs:
  - id: MAR-001
    titulo: Marca con texto libre
    descripcion: >
      La marca grabada en la base acepta letras (mayúsculas y minúsculas), números,
      acentos, ñ, ü y signos comunes, hasta 20 caracteres.
    criterio: >
      La fuente tiene A-Z, a-z, 0-9, áéíóúñü (y mayúsculas) y - _ . , : ! ? ' / + # ( )
      & @; los contornos salen cerrados; un carácter sin dibujo o más de 20 caracteres
      dan un error claro antes de calcular.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAR-002
    titulo: La marca no rompe ninguna maceta
    descripcion: Cobertura de todas las macetas del catálogo con textos de prueba.
    criterio: >
      Para cada uno de los diseños del catálogo y cada texto de prueba (con acentos, ñ,
      números y signos), todas las piezas son mallas cerradas y bien orientadas, y la
      marca queda grabada al menos en una pieza; si no entra en la maceta se avisa.
    prioridad: alta
    nivel: motor
    estado: activa
  - id: MAR-003
    titulo: Cambiar la marca es del paquete Pro
    descripcion: >
      Pro y admin escriben su texto y se graba en las piezas; usuario y visitante ven la
      marca Eden3D con candado "Pro".
    criterio: >
      Para usuario el campo está bloqueado con el candado; para pro se aplica el texto,
      el motor lo graba y el aviso dice en qué pieza quedó; un texto inválido muestra el
      error sin recalcular; al salir de la cuenta vuelve a Eden3D.
    prioridad: alta
    nivel: web
    estado: activa
