name: Calidad y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + matriz de specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: |
          npm ci
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Armar la web
        env:
          # login con Supabase (Settings → Secrets and variables → Actions → Variables)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python tools/build_site.py --out _site

      - name: Tests del motor
        id: motor
        continue-on-error: true
        run: >
          python -m pytest tests/motor -q
          --resultados reports/motor.json --suite motor
          --junitxml reports/motor-junit.xml

      - name: Tests e2e de la web (Playwright)
        id: web
        continue-on-error: true
        env:
          EDEN3D_SITE: _site
        run: >
          python -m pytest tests/web -q
          --resultados reports/web.json --suite web
          --junitxml reports/web-junit.xml
          --screenshot only-on-failure --output test-results

      - name: Matriz de trazabilidad y gate
        id: gate
        continue-on-error: true
        run: >
          python tools/spec_matrix.py --strict
          --resultados reports/motor.json reports/web.json
          --out _site/calidad/data.json
          --historial-previo https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/calidad/data.json
          --resumen-md "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ github.run_number }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

      - name: Preparar la página
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Resultado
        if: steps.motor.outcome != 'success' || steps.web.outcome != 'success' || steps.gate.outcome != 'success'
        run: |
          echo "motor=${{ steps.motor.outcome }} web=${{ steps.web.outcome }} gate=${{ steps.gate.outcome }}"
          exit 1

  deploy:
    name: Publicar en GitHub Pages
    needs: test
    # se publica también con tests en rojo: el tablero de calidad muestra la falla
    if: always() && needs.test.result != 'cancelled' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
