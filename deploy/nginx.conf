# © 2026 Eden3D — nginx para el sitio estático
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # nginx ≥1.21 ya trae application/wasm (Pyodide lo necesita para compilar en streaming)

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               application/wasm text/x-python image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /salud { access_log off; return 200 "ok\n"; }

    # Pesados y versionados: Pyodide, three.js, fuentes, imágenes
    location ~* ^/(vendor|fonts|assets)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # Fuentes del motor que Pyodide baja con fetch
    location ~* \.py$ {
        default_type text/x-python;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    # JS propio: revalidar siempre (cambian con cada deploy)
    location ~* \.(py|js|css|json|html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
